# FreshDonate Plugin Configuration

api:
  # URL вашего FreshDonate Backend API
  url: "http://localhost:3001"

  # Токен плагина из панели: "Настройки → Общее → Выдача товаров"
  apiKey: ""

  # ID из "Настройки → Серверы", если в панели включены мультисервера.
  # Не ставьте один serverId на два сервера, иначе выдача задвоится.
  serverId: ""

  # Интервал опроса API в секундах
  pollInterval: 10
